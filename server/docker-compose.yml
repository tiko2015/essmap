version: "3"
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "npm", "run", "start:server" ]
    ports:
      - 3000:3000
    environment:
      APP_ENV: production
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: essapp
      DB_USERNAME: postgres
      DB_PASSWORD: password
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "npm", "run", "start:worker" ]
    volumes:
      - /usr/src/app
    environment:
      APP_ENV: production
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: essapp
      DB_USERNAME: postgres
      DB_PASSWORD: password
  database:
    image: postgis/postgis:16-3.4-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: essapp
volumes:
  postgres_data:
    external: false
